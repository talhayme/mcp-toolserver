name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Tests
        run: pytest tests/ -q --cov=mcp_toolserver --cov-report=term-missing

  protocol:
    # Installs the real MCP SDK and builds the server, so a breaking SDK
    # change surfaces here rather than in someone's Claude Desktop config.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install with the MCP SDK
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[mcp,dev]"
      - name: Build the server and exercise it over the real SDK
        run: |
          python -c "
          import asyncio
          from mcp_toolserver.server import build_server, TOOL_SCHEMAS

          server = build_server()
          tools = asyncio.run(server.list_tools())
          names = sorted(t.name for t in tools)
          expected = sorted(s['name'] for s in TOOL_SCHEMAS)
          assert names == expected, f'tool names drifted: {names} != {expected}'

          # Every registered tool must carry the hand-written description the
          # model reads when choosing between them.
          for tool in tools:
              assert tool.description, f'{tool.name} lost its description'

          # A real call through the protocol layer, not just construction.
          result = asyncio.run(server.call_tool('calculate', {'expression': '6 * 7'}))
          text = result.content[0].text
          assert '42' in text, f'unexpected tool output: {text}'

          # A failure path must come back as a readable message, not a crash.
          bad = asyncio.run(server.call_tool('calculate', {'expression': 'open(1)'}))
          assert 'Error:' in bad.content[0].text, bad.content[0].text

          print(f'OK: {len(tools)} tools registered and callable:', ', '.join(names))
          "
